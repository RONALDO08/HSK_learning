<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSK 3 Flashcards - Học từ vựng tiếng Trung (Hànyǔ - 汉语)</title>
    <!-- Thư viện SheetJS đọc file Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #FF4A4A;
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --text-dark: #333333;
            --text-light: #666666;
            --shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg); color: var(--text-dark); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        
        .header { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { font-size: 24px; color: var(--primary); }
        .btn { padding: 10px 15px; border: none; border-radius: 8px; background: var(--primary); color: white; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn:hover { background: #e03e3e; }
        
        .control-panel { background: white; padding: 15px; border-radius: 12px; box-shadow: var(--shadow); width: 100%; max-width: 600px; margin-bottom: 20px; text-align: center; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;}
        input[type="file"] { display: none; }
        .custom-file-upload { display: inline-block; padding: 8px 15px; cursor: pointer; background: #3b82f6; color: white; border-radius: 8px; font-weight: bold; font-size: 14px;}
        .status-text { font-size: 14px; color: #10b981; font-weight: bold; width: 100%; text-align: left;}

        /* Card styles */
        .card-container { width: 100%; max-width: 600px; height: 450px; perspective: 1000px; position: relative; margin-bottom: 20px; cursor: pointer; }
        .card { width: 100%; height: 100%; position: absolute; transition: transform 0.6s; transform-style: preserve-3d; box-shadow: var(--shadow); border-radius: 15px; }
        .card.flipped { transform: rotateY(180deg); }
        .card-face { width: 100%; height: 100%; position: absolute; backface-visibility: hidden; border-radius: 15px; background: var(--card-bg); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; }
        .card-back { transform: rotateY(180deg); align-items: flex-start; text-align: left; padding: 30px; overflow-y: auto; }
        
        .hanzi { font-size: 80px; font-weight: bold; margin-bottom: 20px; }
        .pinyin { font-size: 28px; color: var(--primary); font-weight: bold; margin-bottom: 10px; }
        .loaitu { font-size: 14px; background: #eee; padding: 3px 8px; border-radius: 5px; margin-bottom: 15px; display: inline-block;}
        .nghia { font-size: 22px; font-weight: bold; margin-bottom: 20px; }
        .vidu-box { background: #f9f9f9; padding: 15px; border-radius: 10px; width: 100%; border-left: 4px solid var(--primary); }
        .vidu-cn { font-size: 18px; margin-bottom: 5px; }
        .vidu-pn { font-size: 15px; color: var(--text-light); margin-bottom: 5px; }
        .vidu-vi { font-size: 15px; font-style: italic; }
        
        .speaker-btn { background: none; border: none; font-size: 28px; cursor: pointer; transition: 0.2s; margin-left: 10px;}
        .speaker-btn:hover { transform: scale(1.1); }
        .flex-row { display: flex; align-items: center; justify-content: center; width: 100%; }

        /* Navigation */
        .nav-controls { display: flex; justify-content: space-between; width: 100%; max-width: 600px; gap: 10px;}
        .nav-controls button { flex: 1; padding: 15px; font-size: 16px; border-radius: 8px; }
        .btn-secondary { background: #e5e7eb; color: #374151; }
        .btn-secondary:hover { background: #d1d5db; }
        
        /* Modal for Lesson Selection */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center; }
        .modal { background: white; padding: 25px; border-radius: 15px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; }
        .modal h2 { margin-bottom: 15px; }
        .lesson-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .lesson-item { display: flex; align-items: center; gap: 8px; font-size: 15px; }
        .preset-btns { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .preset-btns button { padding: 6px 12px; font-size: 14px; background: #e5e7eb; border: none; border-radius: 5px; cursor: pointer;}
        .preset-btns button:hover { background: #cbd5e1; }
        .close-modal { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h1>HSK 3 Flashcards (kǎpiàn - 卡片)</h1>
        <button class="btn" onclick="openModal()">📚 Chọn bài học</button>
    </div>

    <div class="control-panel">
        <div class="status-text" id="dbStatus">⏳ Đang chờ dữ liệu...</div>
        <label for="excelUpload" class="custom-file-upload">
            📂 Tải file Excel lên (Chỉ cần làm 1 lần)
        </label>
        <input type="file" id="excelUpload" accept=".xlsx, .xls" onchange="handleFileUpload(event)">
    </div>

    <div class="card-container" onclick="toggleCard()">
        <div class="card" id="flashcard">
            <!-- Mặt trước -->
            <div class="card-face card-front">
                <div class="flex-row" style="margin-bottom: 20px;">
                    <div class="hanzi" id="frontHanzi">字</div>
                    <button class="speaker-btn" onclick="speakText(document.getElementById('frontHanzi').innerText, event)">🔊</button>
                </div>
                <p style="color: var(--text-light);">Chạm vào bất kỳ đâu để lật xem đáp án</p>
                <div style="position: absolute; bottom: 20px; font-weight: bold; color: #999;" id="cardCounter">0 / 0</div>
            </div>
            
            <!-- Mặt sau -->
            <div class="card-face card-back">
                <div class="pinyin" id="backPinyin">pīnyīn</div>
                <div class="loaitu" id="backLoaiTu">Loại từ</div>
                <div class="nghia" id="backNghia">Nghĩa tiếng Việt</div>
                
                <div class="vidu-box">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                        <div class="vidu-cn" id="backViDu">Ví dụ tiếng Trung</div>
                        <button class="speaker-btn" style="font-size: 20px;" onclick="speakText(document.getElementById('backViDu').innerText, event)">🔊</button>
                    </div>
                    <div class="vidu-pn" id="backPinyinViDu">Pinyin ví dụ</div>
                    <div class="vidu-vi" id="backDichViDu">Dịch ví dụ</div>
                </div>
            </div>
        </div>
    </div>

    <div class="nav-controls">
        <button class="btn btn-secondary" onclick="prevCard()">⬅️ Từ trước</button>
        <button class="btn btn-secondary" onclick="shuffleDeck()">🔀 Trộn ngẫu nhiên</button>
        <button class="btn" onclick="nextCard()">Từ tiếp ➡️</button>
    </div>

    <!-- Modal chọn bài -->
    <div class="modal-overlay" id="lessonModal">
        <div class="modal">
            <h2>Chọn bài học (Xuédìng - 学习)</h2>
            <div class="preset-btns">
                <button onclick="checkAll(true)">Chọn tất cả</button>
                <button onclick="checkAll(false)">Bỏ chọn tất cả</button>
            </div>
            <div class="lesson-grid" id="lessonGrid"></div>
            <button class="close-modal" onclick="applyLessonFilter()">Xác nhận & Học</button>
        </div>
    </div>

<script>
let flashcards = [];
let currentDeck = [];
let currentIndex = 0;

// Kiểm tra xem trình duyệt đã lưu dữ liệu từ lần trước chưa
window.onload = function() {
    const savedData = localStorage.getItem('hsk3_flashcards');
    if (savedData) {
        try {
            flashcards = JSON.parse(savedData);
            document.getElementById("dbStatus").innerText = `✅ Đã nạp sẵn ${flashcards.length} từ vựng từ bộ nhớ tạm!`;
            initApp();
        } catch(e) {
            document.getElementById("dbStatus").innerText = "⚠️ Dữ liệu lưu bị lỗi, vui lòng tải lại file Excel.";
        }
    } else {
        document.getElementById("dbStatus").innerText = "⚠️ Vui lòng bấm nút 'Tải file Excel lên' ở bên phải để nạp dữ liệu lần đầu.";
    }
};

function handleFileUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    document.getElementById("dbStatus").innerText = "⏳ Đang đọc toàn bộ file Excel...";
    
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            let newCards = [];
            
            workbook.SheetNames.forEach(sheetName => {
                let worksheet = workbook.Sheets[sheetName];
                let rawData = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
                let lessonMatch = sheetName.match(/\d+/);
                let lessonId = lessonMatch ? parseInt(lessonMatch[0], 10) : sheetName;
                
                rawData.forEach(row => {
                    // Đọc đúng các cột từ file Excel của bạn
                    let hanzi = String(row[1] || '').trim();
                    if (hanzi && hanzi !== "Hán tự" && hanzi !== "nan") {
                        newCards.push({
                            bai: lessonId,
                            hanzi: hanzi,
                            pinyin: String(row[2] || '').trim(),
                            loaiTu: String(row[3] || '').trim(),
                            nghia: String(row[4] || '').trim(),
                            viDu: String(row[5] || '').trim(),
                            pinyinViDu: String(row[6] || '').trim(),
                            dichViDu: String(row[7] || '').trim()
                        });
                    }
                });
            });
            
            if (newCards.length > 0) {
                flashcards = newCards;
                // Lưu vào LocalStorage để lần sau mở lên không cần chọn file nữa
                localStorage.setItem('hsk3_flashcards', JSON.stringify(flashcards));
                
                document.getElementById("dbStatus").innerText = `✅ Đã lưu thành công ${flashcards.length} từ vựng vào trình duyệt!`;
                initApp();
                alert(`Nạp thành công ${flashcards.length} từ vựng từ tất cả các bài! Dữ liệu đã được ghi nhớ cho các lần sau.`);
            } else {
                alert("Không tìm thấy dữ liệu hợp lệ trong file Excel.");
            }
        } catch (error) {
            alert("Lỗi đọc file: " + error.message);
        }
    };
    reader.readAsArrayBuffer(file);
}

function initApp() {
    buildLessonSelector();
    applyLessonFilter();
}

function updateCardUI() {
    if (currentDeck.length === 0) {
        document.getElementById('frontHanzi').innerText = "Trống";
        document.getElementById('cardCounter').innerText = "0 / 0";
        return;
    }
    const card = currentDeck[currentIndex];
    document.getElementById('frontHanzi').innerText = card.hanzi || "";
    document.getElementById('backPinyin').innerText = card.pinyin || "";
    
    const backLoaiTu = document.getElementById('backLoaiTu');
    if(card.loaiTu) {
        backLoaiTu.style.display = "inline-block";
        backLoaiTu.innerText = card.loaiTu;
    } else {
        backLoaiTu.style.display = "none";
    }
    
    document.getElementById('backNghia').innerText = card.nghia || "";
    document.getElementById('backViDu').innerText = card.viDu || "";
    document.getElementById('backPinyinViDu').innerText = card.pinyinViDu || "";
    document.getElementById('backDichViDu').innerText = card.dichViDu || "";
    document.getElementById('cardCounter').innerText = `Bài ${card.bai} — ${currentIndex + 1} / ${currentDeck.length}`;
    
    document.getElementById('flashcard').classList.remove('flipped');
}

function toggleCard() {
    document.getElementById('flashcard').classList.toggle('flipped');
}

function nextCard() {
    if (currentIndex < currentDeck.length - 1) {
        currentIndex++;
        updateCardUI();
    }
}

function prevCard() {
    if (currentIndex > 0) {
        currentIndex--;
        updateCardUI();
    }
}

function shuffleDeck() {
    for (let i = currentDeck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [currentDeck[i], currentDeck[j]] = [currentDeck[j], currentDeck[i]];
    }
    currentIndex = 0;
    updateCardUI();
}

function speakText(text, event) {
    if(event) event.stopPropagation();
    if (!text) return;
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'zh-CN';
    utterance.rate = 0.85; 
    speechSynthesis.speak(utterance);
}

function buildLessonSelector() {
    const grid = document.getElementById('lessonGrid');
    grid.innerHTML = '';
    const lessons = [...new Set(flashcards.map(c => c.bai))].sort((a, b) => {
        if(typeof a === 'number' && typeof b === 'number') return a - b;
        return String(a).localeCompare(String(b));
    });
    
    lessons.forEach(l => {
        grid.innerHTML += `
            <label class="lesson-item">
                <input type="checkbox" class="lesson-cb" value="${l}" checked>
                Bài ${l}
            </label>
        `;
    });
}

function checkAll(checked) {
    document.querySelectorAll('.lesson-cb').forEach(cb => cb.checked = checked);
}

function openModal() { document.getElementById('lessonModal').style.display = 'flex'; }

function applyLessonFilter() {
    const selected = Array.from(document.querySelectorAll('.lesson-cb'))
                        .filter(cb => cb.checked)
                        .map(cb => cb.value);
    
    currentDeck = flashcards.filter(c => selected.includes(String(c.bai)));
    currentIndex = 0;
    document.getElementById('lessonModal').style.display = 'none';
    updateCardUI();
}
</script>
</body>
</html>
