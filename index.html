        document.getElementById('preset6_10').addEventListener('click', () => setRangeCheckboxes(6, 10));
        document.getElementById('preset11_15').addEventListener('click', () => setRangeCheckboxes(11, 15));
        document.getElementById('preset16_19').addEventListener('click', () => setRangeCheckboxes(16, 19));

        function setAllCheckboxes(checked) {
            const boxes = lessonCheckboxesGrid.querySelectorAll('.lesson-checkbox');
            boxes.forEach(b => {
                b.checked = checked;
                const parent = b.closest('label');
                if (checked) {
                    parent.className = 'flex items-center gap-2 p-2 rounded-lg border text-sm cursor-pointer transition-colors bg-red-50 border-red-300 text-red-900 font-semibold';
                } else {
                    parent.className = 'flex items-center gap-2 p-2 rounded-lg border text-sm cursor-pointer transition-colors border-gray-200 text-gray-700 hover:bg-gray-50';
                }
            });
            updateModalCount();
        }

        function setRangeCheckboxes(start, end) {
            const boxes = lessonCheckboxesGrid.querySelectorAll('.lesson-checkbox');
            boxes.forEach(b => {
                const val = parseInt(b.value);
                const checked = val >= start && val <= end;
                b.checked = checked;
                const parent = b.closest('label');
                if (checked) {
                    parent.className = 'flex items-center gap-2 p-2 rounded-lg border text-sm cursor-pointer transition-colors bg-red-50 border-red-300 text-red-900 font-semibold';
                } else {
                    parent.className = 'flex items-center gap-2 p-2 rounded-lg border text-sm cursor-pointer transition-colors border-gray-200 text-gray-700 hover:bg-gray-50';
                }
            });
            updateModalCount();
        }

        openFilterBtn.addEventListener('click', () => {
            initModalCheckboxes();
            lessonModal.classList.remove('hidden');
        });

        closeModalBtn.addEventListener('click', () => {
            lessonModal.classList.add('hidden');
        });

        applyFilterBtn.addEventListener('click', () => {
            const checkedBoxes = Array.from(lessonCheckboxesGrid.querySelectorAll('.lesson-checkbox:checked')).map(cb => parseInt(cb.value));
            selectedLessons = new Set(checkedBoxes);
            
            applyFilter();
            lessonModal.classList.add('hidden');
        });

        function applyFilter() {
            currentVocabList = rawVocabData.filter(word => selectedLessons.has(word.lesson));
            currentIndex = 0;
            
            if (selectedLessons.size === 19) {
                selectedLessonsSummary.textContent = 'Đã chọn: Tất cả bài (19 bài)';
            } else if (selectedLessons.size === 0) {
                selectedLessonsSummary.textContent = 'Chưa chọn bài nào';
            } else {
                const arr = Array.from(selectedLessons).sort((a,b) => a - b);
                selectedLessonsSummary.textContent = `Đã chọn: Bài ${arr.join(', ')}`;
            }
            selectedCountBadge.textContent = selectedLessons.size;

            if(isFlipped) {
                flashcardEl.classList.remove('rotate-y-180');
                isFlipped = false;
                setTimeout(updateCard, 300);
            } else {
                updateCard();
            }
        }

        // Shuffle card functionality
        shuffleBtn.addEventListener('click', () => {
            if (currentVocabList.length <= 1) return;
            for (let i = currentVocabList.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentVocabList[i], currentVocabList[j]] = [currentVocabList[j], currentVocabList[i]];
            }
            currentIndex = 0;
            if(isFlipped) {
                flashcardEl.classList.remove('rotate-y-180');
                isFlipped = false;
                setTimeout(updateCard, 300);
            } else {
                updateCard();
            }
        });

        function updateCard() {
            if (currentVocabList.length === 0) {
                setCardContent(null);
                updateUI();
                return;
            }
            
            const currentWord = currentVocabList[currentIndex];
            
            if (isFlipped) {
                flashcardEl.classList.remove('rotate-y-180');
                isFlipped = false;
                
                setTimeout(() => {
                    setCardContent(currentWord);
                }, 300);
            } else {
                setCardContent(currentWord);
            }

            updateUI();
        }

        function setCardContent(word) {
            if (!word) {
                cardFrontText.textContent = "Chưa chọn bài";
                cardPinyinText.textContent = "";
                cardBackText.textContent = "Vui lòng bấm 'Chọn bài học' để chọn ít nhất 1 bài";
                cardLessonInfo.textContent = "Bài --";
                return;
            }
            cardFrontText.textContent = word.chinese;
            cardPinyinText.textContent = word.pinyin || '';
            cardBackText.textContent = word.vietnamese;
            cardLessonInfo.textContent = `Bài ${word.lesson}`;
        }

        function updateUI() {
            currentIndexDisplay.textContent = currentVocabList.length > 0 ? currentIndex + 1 : 0;
            totalCardsDisplay.textContent = currentVocabList.length;
            
            prevBtn.disabled = currentIndex === 0 || currentVocabList.length === 0;
            nextBtn.disabled = currentIndex === currentVocabList.length - 1 || currentVocabList.length === 0;

            const progressPercentage = currentVocabList.length > 0 
                ? ((currentIndex + 1) / currentVocabList.length) * 100 
                : 0;
            progressBar.style.width = `${progressPercentage}%`;
        }

        flashcardEl.addEventListener('click', () => {
            if (currentVocabList.length === 0) return;
            isFlipped = !isFlipped;
            if (isFlipped) {
                flashcardEl.classList.add('rotate-y-180');
            } else {
                flashcardEl.classList.remove('rotate-y-180');
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < currentVocabList.length - 1) {
                currentIndex++;
                updateCard();
            }
        });

        // Keyboard navigation support
        document.addEventListener('keydown', (e) => {
            if (lessonModal && !lessonModal.classList.contains('hidden')) return; // Disable hotkeys when modal is open
            if (e.key === 'ArrowRight' || e.key === ' ') {
                if (currentIndex < currentVocabList.length - 1) {
                    currentIndex++;
                    updateCard();
                }
            } else if (e.key === 'ArrowLeft') {
                 if (currentIndex > 0) {
                    currentIndex--;
                    updateCard();
                }
            } else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                if (currentVocabList.length === 0) return;
                isFlipped = !isFlipped;
                if (isFlipped) {
                    flashcardEl.classList.add('rotate-y-180');
                } else {
                    flashcardEl.classList.remove('rotate-y-180');
                }
            }
        });

        // Initialize the first card
        updateCard();

    </script>
</body>
</html>
